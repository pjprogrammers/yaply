name = "yaply-realtime"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Development defaults. `wrangler dev` uses these; `wrangler deploy --env production`
# uses the production block below instead.
[vars]
ENVIRONMENT = "development"
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003"

[observability]
enabled = true

[durable_objects]
bindings = [
  { name = "GAME_ROOMS", class_name = "GameRoom" }
]

# v1 created the SQLite-backed GameRoom class. The class name is unchanged, so
# this migration is kept verbatim and no data is dropped.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[env.production.vars]
ENVIRONMENT = "production"
# Every deployed frontend origin allowed to call the Worker. Update this list
# when a domain changes. Requests without an allowed Origin are rejected in
# production, so a missing domain is a hard outage for that site.
ALLOWED_ORIGINS = "https://yaplygames.vercel.app,https://yaply-skribbl.vercel.app,https://yaply-chain.vercel.app,https://yaply-smashkarts.vercel.app"

[env.production.durable_objects]
bindings = [
  { name = "GAME_ROOMS", class_name = "GameRoom" }
]

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
