<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Hole.io">
  <rect width="1024" height="1024" rx="232" fill="#dafa9c"/>
  <g>
    <!-- office block falling in -->
    <g transform="translate(786 238) rotate(26)">
      <rect x="-78" y="-104" width="156" height="208" rx="5" fill="#0a0b09"/>
      <g fill="#dafa9c">
        <rect x="-44" y="-70" width="22" height="30" rx="2"/>
        <rect x="2" y="-70" width="22" height="30" rx="2"/>
        <rect x="-44" y="-18" width="22" height="30" rx="2"/>
        <rect x="2" y="-18" width="22" height="30" rx="2"/>
        <rect x="-44" y="34" width="22" height="30" rx="2"/>
        <rect x="2" y="34" width="22" height="30" rx="2"/>
      </g>
    </g>
    <!-- car falling in -->
    <g transform="translate(236 754) rotate(-16)">
      <rect x="-84" y="-41" width="168" height="82" rx="18" fill="#0a0b09"/>
      <rect x="-38" y="-71" width="80" height="46" rx="12" fill="#0a0b09"/>
