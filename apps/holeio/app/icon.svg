      <circle cx="410" cy="250" r="7"/>
      <circle cx="700" cy="830" r="8"/>
      <circle cx="560" cy="862" r="6"/>
    </g>
    <!-- the hole -->
    <circle cx="512" cy="512" r="334" fill="#52287b"/>
    <circle cx="512" cy="512" r="314" fill="#0a0b09"/>
    <circle cx="512" cy="512" r="252" fill="none" stroke="#201430" stroke-width="5"/>
    <circle cx="512" cy="512" r="170" fill="none" stroke="#161616" stroke-width="3"/>
    <path d="M218 428 A306 306 0 0 1 417 221" fill="none" stroke="#684292" stroke-width="7" stroke-linecap="round"/>
