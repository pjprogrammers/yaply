<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yaply - Play with friends</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="home" class="screen">
    <div class="home-container">
      <div class="logo-hero">
        <div class="logo">YAP<span>LY</span></div>
        <div class="logo-tagline">Play with friends • Anytime • Anywhere</div>
      </div>
      <div class="home-grid">
        <div class="card home-card">
          <div class="card-header">
            <div class="card-title">Player Setup</div>
          </div>
          <div class="card-body">
            <div class="field-group">
              <label class="field-label">Nickname</label>
              <input id="name" class="input" maxlength="16" placeholder="Enter your name" autocomplete="off">
            </div>
            <div class="field-group">
              <label class="field-label">Avatar</label>
              <div class="avatar-row">
                <button class="btn-icon ghost" id="ava-left" aria-label="Previous avatar"><span class="material-icons">chevron_left</span></button>
                <div class="avatar-frame">
                  <canvas id="avatar-preview" width="88" height="88"></canvas>
                </div>
                <button class="btn-icon ghost" id="ava-right" aria-label="Next avatar"><span class="material-icons">chevron_right</span></button>
                <button class="btn-icon ghost" id="ava-rand" aria-label="Random avatar"><span class="material-icons">shuffle</span></button>
              </div>
            </div>
            <div class="button-stack">
              <button id="play" class="btn primary large">
                <span class="material-icons">play_arrow</span>
                Quick Play
              </button>
              <button id="create" class="btn large">
                <span class="material-icons">add_circle_outline</span>
                Create Private Room
              </button>
              <div class="divider"><span>or join room</span></div>
              <div class="join-row">
                <input id="roomcode" class="input" maxlength="6" placeholder="ROOM CODE">
                <button id="join" class="btn">
                  <span class="material-icons">login</span>
                  Join
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="lobby" class="screen hidden">
    <header class="app-header">
      <div class="header-left">
        <div class="logo small">YAP<span>LY</span></div>
        <div class="room-pill">
          <span class="material-icons">meeting_room</span>
          <span>Room: <span id="room-id"></span></span>
        </div>
      </div>
      <div class="header-right"></div>
    </header>
    <main class="lobby-layout">
      <section class="card lobby-card">
        <div class="card-header">
          <div class="card-title">
            <span class="material-icons">group</span>
            Players
          </div>
          <div class="card-subtitle"><span id="lobby-player-count">0</span> players</div>
        </div>
        <div class="card-body">
          <div id="lobby-players" class="player-list"></div>
        </div>
      </section>
      <section class="card lobby-card">
        <div class="card-header">
          <div class="card-title">
            <span class="material-icons">tune</span>
            Game Settings
          </div>
        </div>
        <div class="card-body settings-body">
          <div class="setting-row">
            <label class="setting-label">Rounds</label>
            <select id="rounds" class="select">
              <option value="2">2</option>
              <option value="3" selected>3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>
          <div class="setting-row">
            <label class="setting-label">Draw Time</label>
            <select id="drawtime" class="select">
              <option value="60">60s</option>
              <option value="80" selected>80s</option>
              <option value="100">100s</option>
              <option value="120">120s</option>
            </select>
          </div>
          <div class="setting-row">
            <label class="setting-label">Word Count</label>
            <select id="wordcount" class="select">
              <option value="2">2</option>
              <option value="3" selected>3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>
          <button id="start" class="btn primary large start-btn">
            <span class="material-icons">rocket_launch</span>
            Start Game
          </button>
        </div>
      </section>
      <section class="card lobby-card chat-card">
        <div class="card-header">
          <div class="card-title">
            <span class="material-icons">chat</span>
            Lobby Chat
          </div>
        </div>
        <div class="card-body chat-body">
          <div id="lobby-chat" class="chat-box"></div>
          <form id="lobby-chat-form" class="chat-form">
            <input id="lobby-chat-input" class="chat-input" autocomplete="off" placeholder="Say something...">
            <button class="btn icon-btn" aria-label="Send">
              <span class="material-icons">send</span>
            </button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <div id="game" class="screen hidden">
    <header class="app-header">
      <div class="header-left">
        <div class="logo small">YAP<span>LY</span></div>
        <div class="game-stats">
          <div class="stat-pill">
            <span class="material-icons">flag</span>
            <span>Round <span id="round-num">1</span>/<span id="round-max">1</span></span>
          </div>
          <div class="stat-pill timer">
            <span class="material-icons">timer</span>
            <span><span id="time">80</span>s</span>
          </div>
        </div>
      </div>
      <div class="header-center">
        <div id="word-bar" class="word-display">Waiting...</div>
      </div>
      <div class="header-right"></div>
    </header>
    <main class="game-layout">
      <section class="card game-card">
        <div class="card-header">
          <div class="card-title">
            <span class="material-icons">leaderboard</span>
            Players
          </div>
        </div>
        <div class="card-body">
          <div id="game-players" class="player-list"></div>
        </div>
      </section>
      <section class="canvas-section">
        <div class="canvas-wrapper">
          <div id="word-choose" class="word-modal hidden">
            <div class="word-modal-content">
              <div class="word-modal-title">Choose a word to draw</div>
              <div id="word-options" class="word-options-grid"></div>
            </div>
          </div>
          <canvas id="canvas" width="800" height="600" aria-label="Drawing canvas"></canvas>
        </div>
        <div class="toolbar">
          <div class="toolbar-group">
            <div class="colors" id="colors" aria-label="Color palette"></div>
          </div>
          <div class="toolbar-divider"></div>
          <div class="toolbar-group">
            <div class="sizes">
              <button class="size-btn" data-size="4" aria-label="Thin brush"><div class="dot sm"></div></button>
              <button class="size-btn active" data-size="8" aria-label="Medium brush"><div class="dot md"></div></button>
              <button class="size-btn" data-size="16" aria-label="Large brush"><div class="dot lg"></div></button>
              <button class="size-btn" data-size="24" aria-label="Extra large brush"><div class="dot xl"></div></button>
            </div>
          </div>
          <div class="toolbar-divider"></div>
          <div class="toolbar-group">
            <button id="fill" class="btn-icon ghost" title="Fill bucket"><span class="material-icons">format_color_fill</span></button>
            <button id="undo" class="btn-icon ghost" title="Undo"><span class="material-icons">undo</span></button>
            <button id="clear" class="btn-icon ghost danger" title="Clear canvas"><span class="material-icons">delete</span></button>
          </div>
        </div>
      </section>
      <section class="card game-card chat-card">
        <div class="card-header">
          <div class="card-title">
            <span class="material-icons">forum</span>
            Guess Chat
          </div>
        </div>
        <div class="card-body chat-body">
          <div id="game-chat" class="chat-box"></div>
          <form id="game-chat-form" class="chat-form">
            <input id="game-chat-input" class="chat-input" autocomplete="off" placeholder="Type your guess..." maxlength="100">
            <button class="btn icon-btn" aria-label="Guess">
              <span class="material-icons">send</span>
            </button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <div id="end" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-icon">
          <span class="material-icons">emoji_events</span>
        </div>
        <div class="modal-title">Game Over</div>
        <div class="modal-subtitle">Final Standings</div>
      </div>
      <div id="results" class="results"></div>
      <button id="back-home" class="btn primary large">
        <span class="material-icons">home</span>
        Back to Home
      </button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
